steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: Prepare Maven Auth
    entrypoint: bash
    args:
      - -ceu
      - |
        TOKEN="$(gcloud auth print-access-token)"
        cat > /workspace/settings.xml <<EOF
        <settings>
          <servers>
            <server>
              <id>artifact-registry</id>
              <username>oauth2accesstoken</username>
              <password>$${TOKEN}</password>
            </server>
            <server>
              <id>fwmtg-maven-release</id>
              <username>oauth2accesstoken</username>
              <password>$${TOKEN}</password>
            </server>
            <server>
              <id>fwmtg-maven-snapshot</id>
              <username>oauth2accesstoken</username>
              <password>$${TOKEN}</password>
            </server>
          </servers>
          <profiles>
            <profile>
              <id>artifact-registry</id>
              <repositories>
                <repository>
                  <id>central</id>
                  <url>https://repo.maven.apache.org/maven2</url>
                  <releases>
                    <enabled>true</enabled>
                  </releases>
                  <snapshots>
                    <enabled>false</enabled>
                  </snapshots>
                </repository>
                <repository>
                  <id>fwmtg-maven-release</id>
                  <url>https://${_REGION}-maven.pkg.dev/${PROJECT_ID}/fwmtg-maven-release</url>
                  <releases>
                    <enabled>true</enabled>
                  </releases>
                  <snapshots>
                    <enabled>false</enabled>
                  </snapshots>
                </repository>
                <repository>
                  <id>fwmtg-maven-snapshot</id>
                  <url>https://${_REGION}-maven.pkg.dev/${PROJECT_ID}/fwmtg-maven-snapshot</url>
                  <releases>
                    <enabled>false</enabled>
                  </releases>
                  <snapshots>
                    <enabled>true</enabled>
                  </snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>central</id>
                  <url>https://repo.maven.apache.org/maven2</url>
                  <releases>
                    <enabled>true</enabled>
                  </releases>
                  <snapshots>
                    <enabled>false</enabled>
                  </snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>artifact-registry</activeProfile>
          </activeProfiles>
        </settings>
        EOF

  - name: maven:3.9.16-eclipse-temurin-25
    id: Compute Main RC Version
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ ! -f .mvn/maven.config ]]; then
          echo "ERROR: .mvn/maven.config not found" >&2
          exit 1
        fi

        BASE_VERSION="$(sed 's/-Drevision=//' .mvn/maven.config | tr -d '[:space:]')"
        if [[ -z "$${BASE_VERSION}" ]]; then
          echo "ERROR: could not read version from .mvn/maven.config" >&2
          exit 1
        fi

        BASE_VERSION="$(echo "$${BASE_VERSION}" | sed -E 's/-SNAPSHOT$//; s/-RC$//; s/-rc\.[0-9]+$//')"

        EFFECTIVE_VERSION="$${BASE_VERSION}"
        echo "$${EFFECTIVE_VERSION}" > /workspace/effective-version.txt

  - name: maven:3.9.16-eclipse-temurin-25
    id: Test
    entrypoint: bash
    args:
      - -ceu
      - |
        EFFECTIVE_VERSION="$(cat /workspace/effective-version.txt)"
        mvn -B -ntp -s /workspace/settings.xml -Drevision="$${EFFECTIVE_VERSION}" clean verify

  - name: maven:3.9.16-eclipse-temurin-25
    id: Publish Release Candidate
    entrypoint: bash
    args:
      - -ceu
      - |
        EFFECTIVE_VERSION="$(cat /workspace/effective-version.txt)"
        mvn -B -ntp -s /workspace/settings.xml deploy -DskipTests \
          -Drevision="$${EFFECTIVE_VERSION}" \
          -DaltDeploymentRepository=artifact-registry::default::https://${_REGION}-maven.pkg.dev/${PROJECT_ID}/${_REPO_SUFFIX}

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: Log Published Coordinates
    entrypoint: bash
    args:
      - -ceu
      - |
        VERSION="$(cat /workspace/effective-version.txt)"
        echo "Published : uk.gov.ons.census.fwmt:census31-fwmt-common:$${VERSION}"
        echo "Repository: ${_REPO_SUFFIX}"

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    id: Trigger Common Version Bump
    entrypoint: bash
    args:
      - -ceu
      - |
        echo "Invoking trigger: ${_COMMON_BUMP_TRIGGER}"
        if ! gcloud builds triggers run "${_COMMON_BUMP_TRIGGER}" \
          --branch=main \
          --region="${_REGION}" \
          --project="${PROJECT_ID}"; then
          echo "ERROR: failed to invoke common version bump trigger ${_COMMON_BUMP_TRIGGER}" >&2
          exit 1
        fi

substitutions:
  _COMMON_BUMP_TRIGGER: census31-fwmtg-common-bump-version
  _REPO_SUFFIX: fwmtg-maven-release
  _REGION: europe-west2

options:
  logging: CLOUD_LOGGING_ONLY
